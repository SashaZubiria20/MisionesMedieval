<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Misiones Medievales - Gremio</title>
    <link rel="stylesheet" href="./css/style.css">
</head>
<body>

    <header class="cabeceraPrincipal">
        <h1>Tablón de Misiones del Gremio</h1>
    </header>

    <main class="contenedorPrincipal">
        <!-- SECCIÓN 1: PERFIL -->
        <section class="seccionPerfil">
            <h2 class="tituloSeccion">Registro de Aventurero</h2>
            
            <div class="tarjetaPerfil">
                <!-- Zona de Avatar -->
                <div id="zonaAvatar" class="zonaAvatar">
                    <p id="textoAvatar">Arrastra tu foto o haz click</p>
                    <img id="vistaPreviaAvatar" class="vistaPreviaOculta vistaPreviaAvatar" src="#" alt="Tu Avatar">
                    <!-- Input oculto para accesibilidad / Mobile -->
                    <input type="file" id="inputArchivo" class="inputArchivoOculto" accept="image/*">
                </div>

                <!-- Formulario -->
                <form class="formularioRegistro" id="formularioRegistro">
                    <div class="grupoControl">
                        <label for="nombreAventurero">Nombre del Aventurero:</label>
                        <input type="text" id="nombreAventurero" name="nombreAventurero" class="inputTexto" placeholder="Ej. Beric Dondarrion">
                    </div>

                    <div class="grupoControl">
                        <label for="rangoAventurero">Rango en el Gremio:</label>
                        <select id="rangoAventurero" class="selectorRango" name="rangoAventurero">
                            <option value="novato">Novato (Bronce)</option>
                            <option value="explorador">Explorador (Plata)</option>
                            <option value="maestro">Maestro (Oro)</option>
                        </select>
                    </div>

                    <button id="botonGuardarPerfil" class="botonGremio">Inscribirse en el Gremio</button>
                </form>
            </div>
            <p id="mensajeEstado" class="mensajeEstado"></p>
        </section>



        <!-- SECCIÓN 2: TABLÓN DE MISIONES -->
<section class="seccionMisiones">
    <h2 class="tituloSeccion">Tablón de Anuncios</h2>

    <!-- Formulario para Nueva Misión -->
    <div class="tarjetaMisiones">
        <form id="formularioMisiones" class="formularioMisiones">
            <div class="grupoControl">
                <label for="tituloMision">Nombre de la Misión:</label>
                <input type="text" id="tituloMision" name="tituloMision" class="inputTexto" placeholder="Ej. Derrotar al Dragón de JS" required>
            </div>

            <div class="grupoControl">
                <label for="descripcionMision">Descripción (Detalles de la aventura):</label>
                <textarea id="descripcionMision" name="descripcionMision" class="inputArea" rows="3" placeholder="Describe los peligros..." required></textarea>
            </div>

            <div class="grupoControl">
                <label for="dificultadMision">Nivel de Peligro:</label>
                <select id="dificultadMision" name="dificultadMision" class="selectorRango">
                    <option value="facil">Fácil (E-Rank)</option>
                    <option value="intermedia">Intermedia (C-Rank)</option>
                    <option value="dificil">Difícil (A-Rank)</option>
                    <option value="epica">Épica (S-Rank)</option>
                </select>
            </div>

            <button type="submit" id="publicarMisión" class="botonGremio">Publicar Misión</button>
        </form>
    </div>

    <!-- Contenedor donde aparecerán las misiones -->
    <div id="contenedorMisiones" class="contenedorMisiones">
        <!-- Las misiones se generarán aca -->
    </div>
</section>
    </main>

    <script src="./js/main.js"></script>
    <script src="./js/misiones.js"></script>
</body>
</html>
